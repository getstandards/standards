---
# yaml-language-server: $schema=./packages/standards/schemas/v1/standards.schema.json
version: 1
rules:
  - id: clickhouse.ttl-only-drop-parts
    description: Use settings ttl_only_drop_part when using ClickHouse TTL
    rationale: >
      ClickHouse deletes TTL-expired rows through a periodic background job. Since a
      part can hold both expired and non-expired rows, ClickHouse rewrites it rather
      than dropping it. Set ttl_only_drop_part = 1 to drop a part only when all of
      its data has expired.
    level: MUST
    applies_to:
      include:
        - "**/*.sql"
    references:
      - https://clickhouse.com/docs/concepts/best-practices/avoidnullablecolumns
