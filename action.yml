name: "Standards"
description: "Your engineering standards, written once and enforced everywhere."
author: "Nicolas Lecoy <nicolas.lecoy@gmail.com>"

inputs:
  github-token:
    description: "GitHub token for the check run and the summary comment. Defaults to the workflow's GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
  anthropic-api-key:
    description: "API key forwarded to the review as ANTHROPIC_API_KEY."
    required: false
  openai-api-key:
    description: "API key forwarded to the review as OPENAI_API_KEY."
    required: false
  google-api-key:
    description: "API key forwarded to the review as GEMINI_API_KEY."
    required: false
  model:
    description: "Model reference forwarded as STANDARDS_MODEL."
    required: false
  evaluation-model:
    description: "Model reference forwarded as STANDARDS_EVALUATION_MODEL."
    required: false
  verification-model:
    description: "Model reference forwarded as STANDARDS_VERIFICATION_MODEL."
    required: false
  provider-env:
    description: >-
      Names of extra environment variables, separated by spaces or commas,
      that the review may read for a provider credential. Set the variables
      on the step with `env:`. Providers other than the principal three also
      need a `model` input.
    required: false

outputs:
  conclusion:
    description: >-
      The review conclusion, `compliant` or `non-compliant`. Empty when the
      run did not complete a review.
  blocking-count:
    description: "The number of confirmed MUST and MUST NOT findings."
  warning-count:
    description: "The number of confirmed SHOULD and SHOULD NOT findings."
  total-cost:
    description: >-
      The total cost of the review in United States dollars, with four
      decimal places, such as `0.0523`. The report's `cost_basis` states
      whether the value is a charge or an estimate.
  report-file:
    description: >-
      The path of the JSON review report, in the same shape as
      `standards review --format json`.

runs:
  using: "node24"
  main: "dist/action/index.js"
