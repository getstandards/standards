---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-cli:
    name: Publish CLI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Build
        run: mise run build

      # Authentication uses npm trusted publishing (OIDC), configured on the
      # package settings page on npmjs.com. No token is needed, and npm
      # attaches provenance automatically.
      - name: Publish to npm
        working-directory: packages/standards
        run: npm publish

  publish-action:
    name: Publish Action
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Checkout keeps its credentials: the last step pushes tags with the
      # workflow token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `dist/action` is committed to the repository and CI verifies that it
      # matches a fresh build. This step publishes `vX.Y.Z` plus a floating
      # `vX` tag on the release commit, so `uses: getstandards/standards@vX`
      # resolves a working action. It does not touch the release-please tag
      # (no `v` prefix), which must keep pointing at a commit on main.
      - name: Push the action tags
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          MAJOR="${VERSION%%.*}"
          git tag --force "v${VERSION}"
          git tag --force "v${MAJOR}"
          git push --force origin "v${VERSION}" "v${MAJOR}"
